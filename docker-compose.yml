services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - ORBIT_TOKEN_SECRET=${ORBIT_TOKEN_SECRET:-change-me-in-production}
    volumes:
      - db-data:/app/db
      - uploads-data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: social-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db-data:
  uploads-data: